# /etc/nginx/sites-available/parr-prod.conf  ->  ln -s ../sites-available/parr-prod.conf /etc/nginx/sites-enabled/
# Producao: SEM auth_basic (landing publica e indexavel; sem X-Robots-Tag noindex).
# TLS: rodar `certbot --nginx -d parr.primetax.com.br` DEPOIS de ativar este server em HTTP;
# o certbot acrescenta o bloco 443 e o redirect 80 -> 443.
server {
    listen 80;
    listen [::]:80;
    server_name parr.primetax.com.br;

    # Importacao Excel via tRPC (JSON) — o app aceita ate 50 MB
    client_max_body_size 50m;

    access_log /var/log/nginx/parr-prod.access.log;
    error_log  /var/log/nginx/parr-prod.error.log;

    # Callback OAuth do Google Calendar: publico, mesma origem, sem tratamento especial
    location = /api/google-calendar/callback {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # trust proxy = 1 no app: req.ip (rate limit) e req.protocol (cookie Secure) vem daqui
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
